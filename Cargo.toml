[package]
name = "fbittorrent"
version = "0.1.0"
edition = "2021"
description = "Rust torrent app for Omarchy: CLI, magnet handler, TUI and local show feeds"
license = "MIT"

[[bin]]
name = "fbittorrent"
path = "src/main.rs"

[features]
epoch-diagnostics = ["asupersync/epoch-diagnostics"]
chunk-diagnostics = ["librqbit/chunk-diagnostics"]

[dependencies]
ureq = { version = "3.4", features = ["json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
toml = "1.1"
dirs = "6"
anyhow = "1"
libc = "0.2"
ftui = { version = "0.6", features = ["crossterm"] }
ftui-extras = { version = "0.6", features = ["canvas", "image"] }
unicode-width = "0.2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
flate2 = "1"
librqbit = { path = "vendor/rqbit/librqbit", default-features = false, features = ["rust-tls"] }
rqbit-runtime = { path = "vendor/rqbit/rqbit-runtime" }
asupersync = { version = "0.5.0", default-features = false, features = ["native-runtime", "tls", "tls-webpki-roots"] }
quick-xml = { version = "0.38", features = ["encoding"] }
url = "2"
urlencoding = "2"
ring = "0.17.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Keep the CLI/API/UI's resident code compact. Transfer and runtime crates keep
# the full optimization above; release-perf measures the same shipping choice.
[profile.release.package.fbittorrent]
opt-level = "z"

# Keep the same optimization settings while retaining symbols for measurements.
[profile.release-perf]
inherits = "release"
debug = "line-tables-only"
strip = false

[profile.release-perf.package.fbittorrent]
opt-level = "z"

[patch.crates-io]
# Asupersync 0.5.0 with bounded cleanup of cancelled timer entries. Keeping the
# source local makes the profiled fix reproducible without editing the registry.
asupersync = { path = "vendor/asupersync" }

[workspace]
resolver = "2"
members = [
    "vendor/rqbit/librqbit",
    "vendor/rqbit/librqbit-bencode",
    "vendor/rqbit/librqbit-buffers",
    "vendor/rqbit/librqbit-clone-to-owned",
    "vendor/rqbit/librqbit-core",
    "vendor/rqbit/librqbit-dht",
    "vendor/rqbit/librqbit-dualstack-sockets",
    "vendor/rqbit/librqbit-lsd",
    "vendor/rqbit/librqbit-peer-protocol",
    "vendor/rqbit/librqbit-sha1-wrapper",
    "vendor/rqbit/librqbit-tracker-comms",
    "vendor/rqbit/rqbit-runtime",
]
default-members = ["."]
