[package]
name = "fbittorrent"
version = "0.1.0"
edition = "2021"
description = "Fast qBittorrent front-end for Omarchy: CLI, magnet handler, TUI"
license = "MIT"

[[bin]]
name = "fbittorrent"
path = "src/main.rs"

[dependencies]
ureq = { version = "3.4", features = ["json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
toml = "1.1"
dirs = "6"
anyhow = "1"
libc = "0.2"
ftui = { version = "0.6", features = ["crossterm"] }
ftui-extras = { version = "0.6", features = ["canvas", "image"] }
unicode-width = "0.2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
flate2 = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
