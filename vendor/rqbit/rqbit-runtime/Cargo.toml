[package]
name = "rqbit-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Asupersync effects and ownership for the rqbit port"

[dependencies]
asupersync = { version = "=0.5.0", default-features = false, features = ["tls", "tls-native-roots", "tls-webpki-roots"] }
anyhow = "1"
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
url = "2"
getrandom = "0.3"
