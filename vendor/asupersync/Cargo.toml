    "fs",
    "net",
    "poll",
    "process",
    "signal",
    "socket",
    "uio",
    "user",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.polling]
version = "3.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.signal-hook]
version = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.socket2]
version = "0.6"
