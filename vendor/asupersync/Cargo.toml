[target."cfg(unix)".dependencies.xattr]
version = "1.6.1"

[target."cfg(windows)".dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
]

[lints.clippy]
arithmetic_side_effects = "allow"
assert_is_empty = "allow"
assertions_on_constants = "allow"
assign_op_pattern = "allow"
bool_assert_comparison = "allow"
borrow_as_ptr = "allow"
branches_sharing_code = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
chunks_exact_to_as_chunks = "allow"
cloned_ref_to_slice_refs = "allow"
cognitive_complexity = "allow"
collapsible_if = "allow"
collection_is_never_read = "allow"
default_trait_access = "allow"
derive_partial_eq_without_eq = "allow"
doc_lazy_continuation = "allow"
doc_markdown = "allow"
double_must_use = "allow"
drain_collect = "allow"
duration_suboptimal_units = "allow"
explicit_into_iter_loop = "allow"
explicit_iter_loop = "allow"
field_reassign_with_default = "allow"
float_cmp = "allow"
format_collect = "allow"
format_push_string = "allow"
future_not_send = "allow"
if_not_else = "allow"
ignored_unit_patterns = "allow"
implicit_clone = "allow"
inefficient_to_string = "allow"
items_after_statements = "allow"
items_after_test_module = "allow"
iter_with_drain = "allow"
large_enum_variant = "allow"
large_futures = "allow"
len_zero = "allow"
manual_checked_ops = "allow"
manual_clamp = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
manual_let_else = "allow"
manual_slice_fill = "allow"
map_unwrap_or = "allow"
match_like_matches_macro = "allow"
match_same_arms = "allow"
match_wild_err_arm = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_fields_in_debug = "allow"
missing_inline_in_public_items = "allow"
missing_panics_doc = "allow"
module_inception = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
must_use_unit = "allow"
needless_pass_by_ref_mut = "allow"
needless_pass_by_value = "allow"
needless_range_loop = "allow"
new_without_default = "allow"
no_effect_underscore_binding = "allow"
option_if_let_else = "allow"
option_option = "allow"
or_fun_call = "allow"
ptr_as_ptr = "allow"
question_mark = "allow"
read_zero_byte_vec = "allow"
redundant_clone = "allow"
redundant_closure_for_method_calls = "allow"
redundant_else = "allow"
redundant_field_names = "allow"
redundant_pattern_matching = "allow"
result_large_err = "allow"
return_self_not_must_use = "allow"
semicolon_if_nothing_returned = "allow"
should_implement_trait = "allow"
significant_drop_in_scrutinee = "allow"
significant_drop_tightening = "allow"
similar_names = "allow"
single_match = "allow"
single_match_else = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
suboptimal_flops = "allow"
suspicious_operation_groupings = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
type_complexity = "allow"
uninlined_format_args = "allow"
unit_arg = "allow"
unnecessary_debug_formatting = "allow"
unnecessary_lazy_evaluations = "allow"
unnecessary_sort_by = "allow"
unnecessary_wraps = "allow"
unreadable_literal = "allow"
unused_async = "allow"
unused_peekable = "allow"
unused_self = "allow"
use_self = "allow"
used_underscore_binding = "allow"
useless_conversion = "allow"
useless_vec = "allow"
wrong_self_convention = "allow"

[lints.clippy.nursery]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.rust]
missing_docs = "allow"
unsafe_code = "deny"
unused_doc_comments = "allow"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(loom)",
    "cfg(fuzzing)",
    # Retired upstream cfg branches are recognized, but cannot be enabled.
    # Keep this explicit while the remaining shared source is trimmed.
    'cfg(feature, values("atp-cli", "atpd-daemon", "benchmark-adapters", "browser-io", "browser-trace", "cancel-correctness-oracle", "channel-mpsc-select-e2e", "ci-cross-platform", "cli", "compression", "config-file", "criterion-benches", "cross-subsystem-recovery-e2e", "debug-server", "dependency-ledger", "deterministic-mode", "distributed-hash-snapshot-recovery-e2e", "extended-network", "extended-services", "fuzz", "h3-websocket-e2e", "http3", "io-uring", "kafka", "lab-stack-traces", "legacy-internal-test-harnesses", "lock-metrics", "loom-tests", "messaging-fabric", "metrics", "mysql", "nightly-outcome-try", "obligation-cleanup-e2e", "obligation-leak-detection", "postgres", "proc-macros", "quic", "raptorq-roundtrip-e2e", "real-service-e2e", "remote-service", "runtime-metrics", "serialization-golden-harnesses", "simd-intrinsics", "sqlite", "tailscale-path-provider", "test-internals", "tokio-compat", "tower", "trace-compression", "tracing-integration", "waker-profiling", "wasm-browser-deterministic", "wasm-browser-dev", "wasm-browser-minimal", "wasm-browser-preview", "wasm-browser-prod", "wasm-runtime"))',
]

[lints.rust.unused]
level = "warn"
priority = -1

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.release-perf]
opt-level = 3
lto = "thin"
debug = "line-tables-only"
inherits = "release"
strip = false
