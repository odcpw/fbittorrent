# Private fbittorrent native-runtime fork; see FBITTORRENT_PATCH.md.

[package]
edition = "2024"
name = "asupersync"
version = "0.5.0"
build = "build.rs"
include = ["Cargo.toml", "build.rs", "README.md", "FBITTORRENT_PATCH.md", "LICENSE", "src/**"]

autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Spec-first, cancel-correct, capability-secure async runtime for Rust."
documentation = "https://docs.rs/asupersync"
readme = "README.md"
keywords = [
    "async",
    "structured",
    "cancellation",
    "runtime",
]
categories = [
    "asynchronous",
    "concurrency",
]
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
repository = "https://github.com/Dicklesworthstone/asupersync"

[features]
default = []
native-runtime = []
# Measurement-only fixed epoch-kind counters.
epoch-diagnostics = []
# Deterministic runtime used by rqbit-runtime's cancellation/resource test.
lab-runtime = []
tls = ["dep:rustls", "dep:rustls-pki-types", "rustls/ring", "dep:x509-parser"]
tls-native-roots = ["tls", "dep:rustls-native-certs"]
tls-webpki-roots = ["tls", "dep:webpki-roots"]

[lib]
name = "asupersync"
path = "src/lib.rs"

[dependencies.base64]
version = "0.23"
features = ["std"]
default-features = false

[dependencies.bincode]
version = "3.1.1"
features = ["serde"]
package = "bincode-next"

[dependencies.crc32fast]
version = "1.4"

[dependencies.crossbeam-queue]
version = "0.3"

[dependencies.franken-decision]
version = "0.5.0"

[dependencies.franken-evidence]
version = "0.5.0"

[dependencies.franken-kernel]
version = "0.5.0"

[dependencies.futures-lite]
version = "2.6"

[dependencies.getrandom]
version = "0.4"

[dependencies.hashbrown]
version = "0.17"

[dependencies.hex]
version = "0.4"

[dependencies.hmac]
version = "0.13"

[dependencies.memchr]
version = "2.8"

[dependencies.nkeys]
version = "0.4.5"

[dependencies.parking_lot]
version = "0.12"

[dependencies.pin-project]
version = "1.1"

[dependencies.prost]
version = "0.14"

[dependencies.rmp-serde]
version = "1.3"

[dependencies.rustls]
version = "0.23.39"
features = [
    "std",
    "tls12",
]
optional = true
default-features = false

[dependencies.rustls-native-certs]
version = "0.8"
optional = true

[dependencies.rustls-pki-types]
version = "1.14.1"
optional = true

[dependencies.semver]
version = "1.0"
features = ["serde"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[dependencies.sha1]
version = "0.11"

[dependencies.sha2]
version = "0.11"
features = ["zeroize"]

[dependencies.slab]
version = "0.4"

[dependencies.smallvec]
version = "1.15"

[dependencies.subtle]
version = "2.6"

[dependencies.sysinfo]
version = "0.39"

[dependencies.tempfile]
version = "3.25"

[dependencies.thiserror]
version = "2.0"

[dependencies.unicode-normalization]
version = "0.1.25"

[dependencies.webpki-roots]
version = "1.0"
optional = true

[dependencies.x509-parser]
version = "0.18"
optional = true

[dependencies.zeroize]
version = "1.8"
features = ["derive"]

[dev-dependencies.chrono]
version = "0.4"
features = ["serde"]

[dev-dependencies.fastrand]
version = "2.3"

[dev-dependencies.flate2]
version = "1.1"

[dev-dependencies.httparse]
version = "1.8"

[dev-dependencies.insta]
version = "1.40"
features = [
    "json",
    "yaml",
]

[dev-dependencies.lz4_flex]
version = "0.14"

[dev-dependencies.proptest]
version = "1.10"

[dev-dependencies.raptorq]
version = "2.0"

[dev-dependencies.rayon]
version = "1.12"

[dev-dependencies.serde_yaml]
version = "0.9"

[dev-dependencies.tempfile]
version = "3.25"

[dev-dependencies.tokio]
version = "1.0"
features = [
    "rt",
    "sync",
    "time",
]

[dev-dependencies.tokio-util]
version = "0.7"
features = ["codec"]

[dev-dependencies.toml]
version = "1.0"

[dev-dependencies.tracing]
version = "0.1"

[dev-dependencies.tracing-log]
version = "0.2"

[dev-dependencies.tracing-subscriber]
version = "0.3"
features = ["env-filter"]

[dev-dependencies.trybuild]
version = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.aes-gcm]
version = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.chacha20poly1305]
version = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.libc]
