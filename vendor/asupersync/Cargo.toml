[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen-futures]
version = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "BroadcastChannel",
    "DomException",
    "Event",
    "EventTarget",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "MessageChannel",
    "MessagePort",
    "MessageEvent",
    "Window",
    "Storage",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "WorkerGlobalScope",
    "WritableStream",
    "WritableStreamDefaultWriter",
